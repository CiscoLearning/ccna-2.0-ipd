! =====================================================================
! CCNA 2.0 Domain 3.0 - IP Routing Demo
! Device: R3  (Router ID 0.0.0.3)
! Role:   OSPF BDR on the broadcast segment (priority 100).
!         HSRP ACTIVE on the 10.0.34.0/24 LAN (priority 110, preempt).
!         OSPF is passive toward the HSRP LAN (advertised, no adjacency).
! =====================================================================
hostname R3
!
no ip domain lookup
ip cef
ipv6 unicast-routing
ipv6 cef
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 10.0.0.3 255.255.255.255
 ipv6 address 2001:DB8::3/128
 ip ospf 1 area 0
 ipv6 ospf 1 area 0
!
interface Ethernet0/0
 description MGMT VRF - out-of-band to bridge0
 vrf forwarding MGMT
 ip address 198.18.180.3 255.255.192.0
 no shutdown
!
interface Ethernet0/1
 description R3--broadcast segment (OSPF broadcast, BDR pri 100)
 ip address 10.0.234.3 255.255.255.0
 ipv6 address 2001:DB8:234::3/64
 ip ospf 1 area 0
 ip ospf network broadcast
 ip ospf priority 100
 ipv6 ospf 1 area 0
 ipv6 ospf network broadcast
 ipv6 ospf priority 100
 no shutdown
!
interface Ethernet0/2
 description R3--HSRP LAN (HSRP active)
 ip address 10.0.34.3 255.255.255.0
 ipv6 address 2001:DB8:34::3/64
 ip ospf 1 area 0
 ipv6 ospf 1 area 0
 standby version 2
 standby 34 ip 10.0.34.254
 standby 34 priority 110
 standby 34 preempt
 no shutdown
!
router ospf 1
 router-id 0.0.0.3
 passive-interface Ethernet0/2
!
ipv6 router ospf 1
 router-id 0.0.0.3
 passive-interface Ethernet0/2
!
ip route vrf MGMT 0.0.0.0 0.0.0.0 198.18.128.1
!
end
