! =====================================================================
! CCNA 2.0 Domain 3.0 - IP Routing Demo
! Device: R1  (Router ID 0.0.0.1)
! Role:   "Viewer" edge router - the routing-table interpretation focus.
!         - OSPFv2/OSPFv3 point-to-point to R2 (core) and R5 (injector)
!         - Runs EIGRP/RIP/IS-IS/eBGP with R5 to populate the RIB with
!           overlapping prefixes at different Administrative Distances (3.1)
!         - IPv4/IPv6 static (network + host + default) and the intentionally
!           broken IPv4 floating static (3.2)
! =====================================================================
hostname R1
!
no ip domain lookup
ip cef
ipv6 unicast-routing
ipv6 cef
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 10.0.0.1 255.255.255.255
 ipv6 address 2001:DB8::1/128
 ip ospf 1 area 0
 ipv6 ospf 1 area 0
!
interface Ethernet0/0
 description MGMT VRF - out-of-band to bridge0
 vrf forwarding MGMT
 ip address 198.18.180.1 255.255.192.0
 no shutdown
!
interface Ethernet0/1
 description R1--R2 core (OSPFv2/v3 point-to-point)
 ip address 10.0.12.1 255.255.255.0
 ipv6 address 2001:DB8:12::1/64
 ip ospf 1 area 0
 ip ospf network point-to-point
 ipv6 ospf 1 area 0
 ipv6 ospf network point-to-point
 no shutdown
!
interface Ethernet0/2
 description R1--R5 (OSPF p2p + EIGRP/RIP/ISIS/eBGP for 3.1 table)
 ip address 10.0.15.1 255.255.255.0
 ipv6 address 2001:DB8:15::1/64
 ip ospf 1 area 0
 ip ospf network point-to-point
 ipv6 ospf 1 area 0
 ipv6 ospf network point-to-point
 ip router isis
 no shutdown
!
router ospf 1
 router-id 0.0.0.1
!
ipv6 router ospf 1
 router-id 0.0.0.1
!
router eigrp 100
 network 10.0.15.1 0.0.0.0
 no auto-summary
!
router rip
 version 2
 passive-interface default
 no passive-interface Ethernet0/2
 network 10.0.0.0
 no auto-summary
!
router isis
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
!
router bgp 65001
 bgp log-neighbor-changes
 neighbor 10.0.15.5 remote-as 65005
 address-family ipv4
  neighbor 10.0.15.5 activate
 exit-address-family
!
! --- 3.2 static routing demonstrations (IPv4) ---
ip route 192.168.50.0 255.255.255.0 10.0.12.2
ip route 192.168.99.99 255.255.255.255 10.0.12.2
! --- 3.2 floating static: INTENTIONAL recursive-next-hop error ---
!     10.0.0.2 is R2's loopback, only learned via OSPF, so this AD-200
!     backup CANNOT resolve when the OSPF peering/link fails.
ip route 10.0.34.0 255.255.255.0 10.0.0.2 200
! --- MGMT VRF default route ---
ip route vrf MGMT 0.0.0.0 0.0.0.0 198.18.128.1
!
! --- 3.2 static routing demonstrations (IPv6) ---
ipv6 route 2001:DB8:CAFE::/64 2001:DB8:12::2
ipv6 route 2001:DB8:BEEF::100/128 2001:DB8:12::2
ipv6 route ::/0 2001:DB8:12::2
!
end
