! =====================================================================
! CCNA 2.0 Domain 3.0 - IP Routing Demo
! Device: R5  (Router ID 0.0.0.5)
! Role:   "Injector". Advertises a set of phantom loopback prefixes toward
!         R1 through FOUR routing protocols so R1's table shows overlapping
!         prefixes at different Administrative Distances (exam topic 3.1).
!
!         Loopback -> protocol map (per-interface, NOT redistribution, so the
!         routes arrive on R1 as INTERNAL - true default ADs):
!           Lo10 10.30.0.0/24    EIGRP                         -> D  (90)
!           Lo11 10.60.60.0/24   EIGRP + IS-IS + RIP           -> D  (90 wins)
!           Lo12 10.61.0.0/16    IS-IS + RIP                   -> i  (115 wins)
!           Lo13 10.50.50.0/24   eBGP + EIGRP + IS-IS + RIP    -> B  (20 wins)
!           Lo14 10.31.0.0/16    IS-IS                         -> i  (115)
!           Lo15 10.32.0.0/16    RIP                           -> R  (120)
!         Plus BGP-only 10.30.0.0/16 (Null0) -> B (20); with Lo10's /24 this
!         is the longest-prefix-match teaching pair.
!         NOTE: none of these are redistributed into OSPF - the OSPF core
!         stays clean and these prefixes appear ONLY on R1/R5.
! =====================================================================
hostname R5
!
no ip domain lookup
ip cef
ipv6 unicast-routing
ipv6 cef
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 10.0.0.5 255.255.255.255
 ipv6 address 2001:DB8::5/128
 ip ospf 1 area 0
 ipv6 ospf 1 area 0
!
interface Loopback10
 description Inject 10.30.0.0/24 via EIGRP (AD 90)
 ip address 10.30.0.1 255.255.255.0
!
interface Loopback11
 description Inject 10.60.60.0/24 via EIGRP + ISIS + RIP
 ip address 10.60.60.1 255.255.255.0
 ip router isis
!
interface Loopback12
 description Inject 10.61.0.0/16 via ISIS + RIP
 ip address 10.61.0.1 255.255.0.0
 ip router isis
!
interface Loopback13
 description Inject 10.50.50.0/24 via eBGP + EIGRP + ISIS + RIP
 ip address 10.50.50.1 255.255.255.0
 ip router isis
!
interface Loopback14
 description Inject 10.31.0.0/16 via ISIS
 ip address 10.31.0.1 255.255.0.0
 ip router isis
!
interface Loopback15
 description Inject 10.32.0.0/16 via RIP
 ip address 10.32.0.1 255.255.0.0
!
interface Ethernet0/0
 description MGMT VRF - out-of-band to bridge0
 vrf forwarding MGMT
 ip address 198.18.180.5 255.255.192.0
 no shutdown
!
interface Ethernet0/1
 description R5--R1 (OSPF p2p + EIGRP/RIP/ISIS/eBGP injection)
 ip address 10.0.15.5 255.255.255.0
 ipv6 address 2001:DB8:15::5/64
 ip ospf 1 area 0
 ip ospf network point-to-point
 ipv6 ospf 1 area 0
 ipv6 ospf network point-to-point
 ip router isis
 no shutdown
!
! BGP-only /16 (phantom) - pairs with Lo10 /24 for the LPM demo
ip route 10.30.0.0 255.255.0.0 Null0
!
router ospf 1
 router-id 0.0.0.5
!
ipv6 router ospf 1
 router-id 0.0.0.5
!
router eigrp 100
 network 10.0.15.5 0.0.0.0
 network 10.30.0.0 0.0.0.255
 network 10.50.50.0 0.0.0.255
 network 10.60.60.0 0.0.0.255
 no auto-summary
!
router rip
 version 2
 passive-interface default
 no passive-interface Ethernet0/1
 network 10.0.0.0
 no auto-summary
!
router isis
 net 49.0001.0000.0000.0005.00
 is-type level-2-only
 metric-style wide
!
router bgp 65005
 bgp log-neighbor-changes
 neighbor 10.0.15.1 remote-as 65001
 address-family ipv4
  network 10.30.0.0 mask 255.255.0.0
  network 10.50.50.0 mask 255.255.255.0
  neighbor 10.0.15.1 activate
 exit-address-family
!
ip route vrf MGMT 0.0.0.0 0.0.0.0 198.18.128.1
!
end
