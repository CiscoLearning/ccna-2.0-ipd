! =====================================================================
! CCNA 2.0 Domain 3.0 - IP Routing Demo
! Device: R2  (Router ID 0.0.0.2)
! Role:   Core hub.
!         - OSPFv2/OSPFv3 point-to-point to R1
!         - OSPF DR on the broadcast segment (priority 255)
!         - Originates the default route into OSPF (gateway of last resort)
! =====================================================================
hostname R2
!
no ip domain lookup
ip cef
ipv6 unicast-routing
ipv6 cef
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 10.0.0.2 255.255.255.255
 ipv6 address 2001:DB8::2/128
 ip ospf 1 area 0
 ipv6 ospf 1 area 0
!
interface Ethernet0/0
 description MGMT VRF - out-of-band to bridge0
 vrf forwarding MGMT
 ip address 198.18.180.2 255.255.192.0
 no shutdown
!
interface Ethernet0/1
 description R2--R1 core (OSPFv2/v3 point-to-point)
 ip address 10.0.12.2 255.255.255.0
 ipv6 address 2001:DB8:12::2/64
 ip ospf 1 area 0
 ip ospf network point-to-point
 ipv6 ospf 1 area 0
 ipv6 ospf network point-to-point
 no shutdown
!
interface Ethernet0/2
 description R2--broadcast segment (OSPF broadcast, DR pri 255)
 ip address 10.0.234.2 255.255.255.0
 ipv6 address 2001:DB8:234::2/64
 ip ospf 1 area 0
 ip ospf network broadcast
 ip ospf priority 255
 ipv6 ospf 1 area 0
 ipv6 ospf network broadcast
 ipv6 ospf priority 255
 no shutdown
!
router ospf 1
 router-id 0.0.0.2
 default-information originate always
!
ipv6 router ospf 1
 router-id 0.0.0.2
!
ip route vrf MGMT 0.0.0.0 0.0.0.0 198.18.128.1
!
end
