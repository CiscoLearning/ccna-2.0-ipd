#
# CCNA 2.0 Domain 3.0 - IP Routing Demo
# Cisco Modeling Labs (CML) topology - schema version 0.3.1
#
# Import into CML:  Dashboard -> Import -> Topology, select this file.
# CML-Free compatible: 5 active nodes (iol-xe). Unmanaged switches and the
# external connector do not count against the node limit.
#
annotations: []
smart_annotations: []
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  x: -250
  y: -100
  tags: []
  configuration:
  - name: ios_config.txt
    content: |-
      hostname R1
      !
      no ip domain lookup
      ip cef
      ipv6 unicast-routing
      ipv6 cef
      !
      vrf definition MGMT
       address-family ipv4
       exit-address-family
      !
      interface Loopback0
       ip address 10.0.0.1 255.255.255.255
       ipv6 address 2001:DB8::1/128
       ip ospf 1 area 0
       ipv6 ospf 1 area 0
      !
      interface Ethernet0/0
       description MGMT VRF - out-of-band to bridge0
       vrf forwarding MGMT
       ip address 198.18.180.1 255.255.192.0
       no shutdown
      !
      interface Ethernet0/1
       description R1--R2 core (OSPFv2/v3 point-to-point)
       ip address 10.0.12.1 255.255.255.0
       ipv6 address 2001:DB8:12::1/64
       ip ospf 1 area 0
       ip ospf network point-to-point
       ipv6 ospf 1 area 0
       ipv6 ospf network point-to-point
       no shutdown
      !
      interface Ethernet0/2
       description R1--R5 (OSPF p2p + EIGRP/RIP/ISIS/eBGP for 3.1 table)
       ip address 10.0.15.1 255.255.255.0
       ipv6 address 2001:DB8:15::1/64
       ip ospf 1 area 0
       ip ospf network point-to-point
       ipv6 ospf 1 area 0
       ipv6 ospf network point-to-point
       ip router isis
       no shutdown
      !
      router ospf 1
       router-id 0.0.0.1
      !
      ipv6 router ospf 1
       router-id 0.0.0.1
      !
      router eigrp 100
       network 10.0.15.1 0.0.0.0
       no auto-summary
      !
      router rip
       version 2
       passive-interface default
       no passive-interface Ethernet0/2
       network 10.0.0.0
       no auto-summary
      !
      router isis
       net 49.0001.0000.0000.0001.00
       is-type level-2-only
       metric-style wide
      !
      router bgp 65001
       bgp log-neighbor-changes
       neighbor 10.0.15.5 remote-as 65005
       address-family ipv4
        neighbor 10.0.15.5 activate
       exit-address-family
      !
      ip route 192.168.50.0 255.255.255.0 10.0.12.2
      ip route 192.168.99.99 255.255.255.255 10.0.12.2
      ip route 10.0.34.0 255.255.255.0 10.0.0.2 200
      ip route vrf MGMT 0.0.0.0 0.0.0.0 198.18.128.1
      !
      ipv6 route 2001:DB8:CAFE::/64 2001:DB8:12::2
      ipv6 route 2001:DB8:BEEF::100/128 2001:DB8:12::2
      ipv6 route ::/0 2001:DB8:12::2
      !
      end
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    type: physical
    slot: 0
  - id: i2
    label: Ethernet0/1
    type: physical
    slot: 1
  - id: i3
    label: Ethernet0/2
    type: physical
    slot: 2
  - id: i4
    label: Ethernet0/3
    type: physical
    slot: 3
- id: n1
  label: R2
