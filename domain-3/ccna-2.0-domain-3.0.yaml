lab:
  title: CCNA 2.0 Domain 3.0 - IP Routing Demo
  description: >-
    CCNA 2.0 Domain 3.0 (IP Routing) instructor demonstration. Single-area
    OSPFv2/OSPFv3 (p2p + broadcast DR/BDR), HSRP FHRP, IPv4/IPv6 static +
    floating static (with deliberate recursive-next-hop error), and a
    multi-protocol (EIGRP/RIP/IS-IS/eBGP) routing-table interpretation
    exercise. CML-Free compatible (5 IOL nodes).
  notes: >-
    CCNA 2.0 Domain 3.0 - IP Routing. Maps to exam topics 3.1 (routing table
    interpretation), 3.2 (IPv4/IPv6 static incl. floating), 3.3 (single-area
    OSPFv2/OSPFv3, p2p/broadcast/DR-BDR/RID), 3.4 (FHRP/HSRP status). Built for
    Cisco Networking Academy Instructor Professional Development.
  version: 0.3.1
